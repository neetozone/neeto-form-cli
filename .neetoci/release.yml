version: v1.0

fail_fast: true

plan: pro

machine_type: multi

commands:
  - checkout
  - neetoci-version go 1.26
  - curl -fsSL https://raw.githubusercontent.com/neetozone/neeto-cli-commons/4f3a9552b98b859c6259fce5a99f3998e03e0602/assets/release.sh -o /tmp/neeto-cli-release.sh
  - echo "9b34aac76a466778bacaa83a783ddacd0fd885cbf45de96a4cee34cb6a287dd0  /tmp/neeto-cli-release.sh" | sha256sum -c -
  - bash /tmp/neeto-cli-release.sh

triggers:
  - event: branch
    branch_name: main
